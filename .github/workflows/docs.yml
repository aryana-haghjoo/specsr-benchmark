name: Deploy docs

# Publishes the Sphinx site to GitHub Pages on every push to main.
#
# The docs are also built with warnings-as-errors by the test workflow on every
# push and pull request; that is the gate. This one only deploys, so a broken
# build never reaches the site and a deployment failure never masks a doc error.
#
# Needs Pages enabled with "GitHub Actions" as the source, once, in
# Settings -> Pages. Pages on a private repository requires a paid plan; on a
# public repository it is free.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; the two below are the minimum Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight -- an interrupted
# deploy can leave the site on a half-uploaded artefact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only the public repository has a Pages site. Pages on a private repository
    # needs a paid plan, so there configure-pages fails on every push -- a
    # standing red X for a deployment that was never meant to happen. This file
    # ships verbatim to the public repository, so the guard has to live in the
    # workflow rather than in which repository carries the file. `deploy` needs
    # `build`, so skipping the one skips the other.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # conf.py mocks torch and specsr for autodoc, so the docs extra alone is
        # enough -- no deep-learning stack is downloaded to render a docstring.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build docs (warnings are errors)
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
