# Public CI for the specsrbench package.
#
# Shipped as .github/workflows/tests.yml by scripts/make_public_release.sh.
# It is a different workflow from the private repository's, and deliberately
# so: that one sparse-checks-out three committed cache directories and the
# manuscript, none of which exist here. Pointing it at absent paths would leave
# every data-dependent test skipping and still report a green tick, which is
# worse than not running them.
#
# What this can honestly check without any data: the algorithms, the metrics,
# the package's structure, and that it installs and imports.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: unit + structure (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Import and CLI
        run: |
          python -c "import specsrbench; print(specsrbench.__version__)"
          specsrbench --version
          specsrbench paths
          specsrbench figures --help

      - name: Test
        # Tests that need a cache skip cleanly; -ra lists them, so the log says
        # what was and was not exercised rather than implying it was all green.
        run: pytest -m "not slow" -ra

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check src tests scripts

  docs:
    name: docs build
    # The gate for the documentation. Deployment lives in docs.yml and only
    # runs on main, so a broken build fails here -- visibly, on the pull
    # request -- rather than silently not updating the site.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build docs (warnings are errors)
        run: sphinx-build -b html -W --keep-going docs docs/_build/html
